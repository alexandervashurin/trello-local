<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trello Local</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="header">
    <h1>📋 Мои доски</h1>
    <div class="user-menu">
      <span id="current-user"></span>
      <button class="btn btn-secondary" onclick="openSessionsModal()" id="sessions-btn" style="display:none;" title="Управление сессиями">🔐 Сессии</button>
      <button class="btn btn-secondary" onclick="logout()" id="logout-btn" style="display:none;">🚪 Выйти</button>
    </div>
    <input type="text" id="search-input" placeholder="🔍 Поиск досок..." autocomplete="off">
    <button class="create-board-btn" id="create-board-btn">➕ Новая доска</button>
  </div>

  <div id="boards-container">
    <div class="loading" id="loading-indicator">Загрузка досок...</div>
    <div id="boards"></div>
  </div>

  <!-- Модальное окно участников -->
  <div id="members-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>👥 Участники доски</h2>
        <button class="modal-close" onclick="closeMembersModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div id="members-list">
          <div class="loading">Загрузка...</div>
        </div>
      </div>
      <div class="add-member-form">
        <input type="text" id="new-member-username" placeholder="Имя пользователя" autocomplete="off">
        <select id="new-member-role" style="margin-left:8px;">
          <option value="viewer">👁️ Наблюдатель</option>
          <option value="member" selected>✏️ Участник</option>
          <option value="editor">📝 Редактор</option>
          <option value="admin">⭐ Админ</option>
        </select>
        <button class="btn btn-primary" onclick="addMember()">Добавить</button>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeMembersModal()">Закрыть</button>
      </div>
    </div>
  </div>

  <!-- Модальное окно приглашений -->
  <div id="invitations-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>🔗 Приглашения</h2>
        <button class="modal-close" onclick="closeInvitationsModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div id="invitations-list">
          <div class="loading">Загрузка...</div>
        </div>
      </div>
      <div class="add-invitation-form">
        <select id="invitation-role">
          <option value="viewer">👁️ Наблюдатель</option>
          <option value="member" selected>✏️ Участник</option>
          <option value="editor">📝 Редактор</option>
          <option value="admin">⭐ Админ</option>
        </select>
        <input type="number" id="invitation-expires" placeholder="Часов (0 = бессрочно)" min="0" value="24" style="margin-left:8px; width:150px;">
        <button class="btn btn-primary" onclick="createInvitation()" style="margin-left:8px;">Создать</button>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeInvitationsModal()">Закрыть</button>
      </div>
    </div>
  </div>

  <!-- Модальное окно комментариев -->
  <div id="comments-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>💬 Комментарии</h2>
        <button class="modal-close" onclick="closeCommentsModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div id="comments-list">
          <div class="loading">Загрузка...</div>
        </div>
      </div>
      <div class="add-comment-form">
        <textarea id="new-comment-content" placeholder="Напишите комментарий..." rows="3" autocomplete="off"></textarea>
        <button class="btn btn-primary" onclick="addComment()">Отправить</button>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeCommentsModal()">Закрыть</button>
      </div>
    </div>
  </div>

  <!-- Модальное окно редактирования карточки -->
  <div id="card-modal" class="modal">
    <div class="modal-content card-modal-content">
      <div class="modal-header">
        <h2>📝 Карточка</h2>
        <button class="modal-close" onclick="closeCardModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div class="card-edit-form">
          <label class="card-edit-label">
            <span>Название</span>
            <input type="text" id="card-title" placeholder="Название карточки" maxlength="100">
          </label>
          <label class="card-edit-label">
            <span>Описание</span>
            <textarea id="card-content" placeholder="Описание" rows="3"></textarea>
          </label>
          <label class="card-edit-label">
            <span>📅 Дедлайн</span>
            <input type="datetime-local" id="card-due-date">
            <button class="btn btn-secondary btn-sm" onclick="clearDueDate()" style="margin-left:8px;">✕</button>
          </label>
          
          <div class="card-section">
            <h4>🏷️ Метки</h4>
            <div id="card-labels" class="labels-container"></div>
            <div class="add-label-form">
              <input type="text" id="new-label-name" placeholder="Название метки" maxlength="30">
              <select id="new-label-color">
                <option value="blue">🔵 Синий</option>
                <option value="green">🟢 Зелёный</option>
                <option value="yellow">🟡 Жёлтый</option>
                <option value="red">🔴 Красный</option>
                <option value="purple">🟣 Фиолетовый</option>
                <option value="orange">🟠 Оранжевый</option>
              </select>
              <button class="btn btn-primary btn-sm" onclick="addLabel()">Добавить</button>
            </div>
          </div>

          <div class="card-section">
            <h4>📎 Вложения</h4>
            <div id="card-attachments" class="attachments-container"></div>
            <div class="add-attachment-form">
              <input type="file" id="new-attachment" style="display:none;" onchange="handleFileSelect(this)">
              <button class="btn btn-secondary btn-sm" onclick="document.getElementById('new-attachment').click()">📎 Прикрепить файл</button>
            </div>
          </div>

          <div class="card-section">
            <h4>📜 История</h4>
            <div id="card-activity" class="activity-container"></div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary" onclick="saveCardFromModal()">💾 Сохранить</button>
        <button class="btn btn-secondary" onclick="closeCardModal()">Закрыть</button>
      </div>
    </div>
  </div>

  <!-- Модальное окно истории доски -->
  <div id="activity-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>📜 История доски</h2>
        <button class="modal-close" onclick="closeActivityModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div id="activity-list">
          <div class="loading">Загрузка...</div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeActivityModal()">Закрыть</button>
      </div>
    </div>
  </div>

  <!-- Модальное окно просмотра изображений -->
  <div id="image-preview-modal" class="modal">
    <div class="modal-content" style="max-width:90%; min-width:auto; padding:12px; background:transparent; box-shadow:none;">
      <div class="modal-header">
        <h2 style="color:white;">🖼️ Просмотр изображения</h2>
        <button class="modal-close" onclick="closeImagePreview()" style="color:white;">&times;</button>
      </div>
      <div class="modal-body" style="max-height:none; text-align:center;">
        <img id="image-preview-img" src="" alt="Preview" style="max-width:100%; max-height:80vh; border-radius:4px;">
      </div>
    </div>
  </div>

  <!-- Модальное окно сессий -->
  <div id="sessions-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>🔐 Управление сессиями</h2>
        <button class="modal-close" onclick="closeSessionsModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div id="sessions-list">
          <div class="loading">Загрузка...</div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-danger" onclick="logoutAllSessions()">🚪 Завершить все сессии</button>
        <button class="btn btn-secondary" onclick="closeSessionsModal()">Закрыть</button>
      </div>
    </div>
  </div>

  <!-- Модальное окно статистики -->
  <div id="stats-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>📊 Статистика доски</h2>
        <button class="modal-close" onclick="closeBoardStats()">&times;</button>
      </div>
      <div class="modal-body">
        <div id="stats-content">
          <div class="loading">Загрузка статистики...</div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeBoardStats()">Закрыть</button>
      </div>
    </div>
  </div>

  <!-- Toast контейнер -->
  <div class="toast-container" id="toast-container"></div>

  <script>
    // Проверка авторизации при загрузке
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user') || 'null');

    if (!token || !user) {
      window.location.href = '/login.html';
    } else {
      document.getElementById('current-user').textContent = '👤 ' + user.username;
      document.getElementById('logout-btn').style.display = 'block';
      document.getElementById('sessions-btn').style.display = 'block';
    }

    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      window.location.href = '/login.html';
    }

    // Закрытие модального окна по клику вне его
    document.getElementById('members-modal').addEventListener('click', function(e) {
      if (e.target === this) {
        closeMembersModal();
      }
    });

    // Закрытие модального окна комментариев по клику вне его
    document.getElementById('comments-modal').addEventListener('click', function(e) {
      if (e.target === this) {
        closeCommentsModal();
      }
    });

    // Enter для добавления участника
    document.getElementById('new-member-username').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        addMember();
      }
    });

    // Ctrl+Enter для добавления комментария
    document.getElementById('new-comment-content').addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && e.ctrlKey) {
        addComment();
      }
    });

    // Закрытие модального окна карточки по клику вне его
    document.getElementById('card-modal').addEventListener('click', function(e) {
      if (e.target === this) {
        closeCardModal();
      }
    });

    // Закрытие модального окна истории по клику вне его
    document.getElementById('activity-modal').addEventListener('click', function(e) {
      if (e.target === this) {
        closeActivityModal();
      }
    });

    // Закрытие модального окна приглашений по клику вне его
    document.getElementById('invitations-modal').addEventListener('click', function(e) {
      if (e.target === this) {
        closeInvitationsModal();
      }
    });

    // Закрытие модального окна просмотра изображений по клику вне его
    document.getElementById('image-preview-modal').addEventListener('click', function(e) {
      if (e.target === this) {
        closeImagePreview();
      }
    });

    // Закрытие модального окна сессий по клику вне его
    document.getElementById('sessions-modal').addEventListener('click', function(e) {
      if (e.target === this) {
        closeSessionsModal();
      }
    });

    // Закрытие модального окна статистики по клику вне его
    document.getElementById('stats-modal').addEventListener('click', function(e) {
      if (e.target === this) {
        closeBoardStats();
      }
    });

    // Ctrl+Enter для создания приглашения
    document.getElementById('invitation-role').addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && e.ctrlKey) {
        createInvitation();
      }
    });
  </script>

  <script src="app.js"></script>
</body>
</html>
