<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trello Local</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="header">
    <h1>📋 Мои доски</h1>
    <div class="user-menu">
      <span id="current-user"></span>
      <button class="btn btn-secondary" onclick="logout()" id="logout-btn" style="display:none;">🚪 Выйти</button>
    </div>
    <input type="text" id="search-input" placeholder="🔍 Поиск досок..." autocomplete="off">
    <button class="create-board-btn" id="create-board-btn">➕ Новая доска</button>
  </div>

  <div id="boards-container">
    <div class="loading" id="loading-indicator">Загрузка досок...</div>
    <div id="boards"></div>
  </div>

  <!-- Модальное окно участников -->
  <div id="members-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>👥 Участники доски</h2>
        <button class="modal-close" onclick="closeMembersModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div id="members-list">
          <div class="loading">Загрузка...</div>
        </div>
      </div>
      <div class="add-member-form">
        <input type="text" id="new-member-username" placeholder="Имя пользователя" autocomplete="off">
        <button class="btn btn-primary" onclick="addMember()">Добавить</button>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeMembersModal()">Закрыть</button>
      </div>
    </div>
  </div>

  <!-- Toast контейнер -->
  <div class="toast-container" id="toast-container"></div>

  <script>
    // Проверка авторизации при загрузке
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user') || 'null');

    if (!token || !user) {
      window.location.href = '/login.html';
    } else {
      document.getElementById('current-user').textContent = '👤 ' + user.username;
      document.getElementById('logout-btn').style.display = 'block';
    }

    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      window.location.href = '/login.html';
    }

    // Закрытие модального окна по клику вне его
    document.getElementById('members-modal').addEventListener('click', function(e) {
      if (e.target === this) {
        closeMembersModal();
      }
    });

    // Enter для добавления участника
    document.getElementById('new-member-username').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        addMember();
      }
    });
  </script>

  <script src="app.js"></script>
</body>
</html>
