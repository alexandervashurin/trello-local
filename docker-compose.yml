version: '3.8'

services:
  trello-local:
    build: .
    container_name: trello-local
    ports:
      - "8080:8080"
    volumes:
      - trello-data:/app/backend/data
    environment:
      - RUST_LOG=info
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/boards"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  trello-data:
    driver: local
